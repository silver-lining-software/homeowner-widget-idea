<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atix Contractor — Project Info</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="flow-screens.css">
<link rel="stylesheet" href="auth.css"></head>
<body>
  <div class="site-shell">
    <header class="host-header border-bottom">
      <div class="container-fluid app-max d-flex align-items-center justify-content-between gap-3">
        <a class="host-brand text-decoration-none" href="index.html">
          <span class="brand-mark"><i class="bi bi-snow2"></i></span>
          <span>
            <strong>Atix</strong>
            <small>Contractor</small>
          </span>
        </a>
        <div class="host-status d-none d-md-flex align-items-center gap-2">
          <span class="status-dot"></span>
          <span>HVAC Contractor Platform</span>
        </div>
      </div>
    </header>

    <main class="page-wrap py-4">
      <div class="container-fluid app-max">
        <section class="app-frame flow-app">
          <div class="app-frame__eyebrow">
            <span class="eyebrow-pill">
              <i class="bi bi-grid-1x2-fill"></i>
              Contractor Workspace
            </span>
          </div>

          <nav class="app-toolbar navbar navbar-expand-md">
            <div class="container-fluid px-0">
              <div class="d-flex align-items-center flex-wrap gap-2">
                <a href="index.html" class="btn btn-toolbar-link active">
                  <i class="bi bi-list-task"></i>
                  <span>My Projects</span>
                </a>
                <button class="btn btn-primary btn-create" type="button">
                  <i class="bi bi-plus-lg"></i>
                  <span>Create New Project</span>
                </button>
              </div>

              <div class="dropdown ms-md-auto mt-2 mt-md-0">
                <button class="btn btn-user dropdown-toggle" type="button" data-bs-toggle="dropdown">
                  <span class="user-avatar"><i class="bi bi-person"></i></span>
                  <span class="text-start">
                    <small>Account</small>
                    <strong>Guest User</strong>
                  </span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end user-menu shadow-sm">
                  <li><button class="dropdown-item" type="button"><i class="bi bi-box-arrow-in-right"></i>Sign in</button></li>
                </ul>
              </div>
            </div>
          </nav>

          <section class="flow-stepper-wrap">
            <div class="flow-stepper">
              <div class="flow-step active">
                <div class="flow-step__dot"></div>
                <span>Project</span>
              </div>
              <div class="flow-line"></div>
              <div class="flow-step">
                <div class="flow-step__dot"></div>
                <span>Workscopes</span>
              </div>
              <div class="flow-line"></div>
              <div class="flow-step">
                <div class="flow-step__dot"></div>
                <span>Customer Info</span>
              </div>
              <div class="flow-line"></div>
              <div class="flow-step">
                <div class="flow-step__dot"></div>
                <span>Estimate</span>
              </div>
            </div>
          </section>

          <section class="screen-panel">
            <div class="map-stage">
              <div class="map-grid map-grid-a"></div>
              <div class="map-grid map-grid-b"></div>
              <div class="map-grid map-grid-c"></div>
              <div class="map-road map-road-a"></div>
              <div class="map-road map-road-b"></div>
              <div class="map-road map-road-c"></div>
              <div class="map-park"></div>

              <div class="floating-card project-card">
                <div class="floating-card__header">
                  <span class="card-icon"><i class="bi bi-house-door"></i></span>
                  <h1>Project Info</h1>
                </div>
                <p class="floating-card__copy">
                  Start by adding the basic information for this project.
                </p>

                <div class="mb-3">
                  <label for="projectName" class="form-label">Project Name</label>
                  <input id="projectName" type="text" class="form-control" placeholder="Example: Smith Residence HVAC Replacement">
                </div>

                <div class="mb-4">
                  <label for="projectAddress" class="form-label">Address</label>
                  <div class="input-icon-wrap">
                    <i class="bi bi-geo-alt"></i>
                    <input id="projectAddress" type="text" class="form-control" placeholder="Enter project address">
                  </div>
                </div>

                <a href="workscope.html" class="btn btn-primary w-100">
                  Go to Workscopes
                  <i class="bi bi-arrow-right ms-2"></i>
                </a>
              </div>
            </div>
          </section>
        </section>
      </div>
    </main>

    <footer class="host-footer border-top">
      <div class="container-fluid app-max d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2">
        <span>© 2026 Atix Contractor</span>
        <span>Professional HVAC project workflows</span>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="project-state.js"></script><script src="auth.js"></script><script src="embed.js"></script>
</body>
</html>
