<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Atix project widget</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="widget.css"></head><body class="widget-shell">
<nav class="widget-toolbar" aria-label="Application navigation"><div class="toolbar-actions"><a class="toolbar-button" href="projects.html" target="widget-screen">☷ My Projects</a><a class="toolbar-button primary" href="templates.html" target="widget-screen">＋ Create New Project</a></div><details class="account"><summary><span class="avatar">♙</span><span><small>Account</small><strong>Guest User</strong></span><span>▾</span></summary><div class="account-menu">You are browsing as a guest.<br><small>Sign-in will be connected in a later step.</small></div></details></nav>
<iframe name="widget-screen" id="widget-screen" src="templates.html" title="Project workflow"></iframe>
<script src="auth.js"></script><script src="widget-account.js"></script><script>const screen=document.getElementById('widget-screen');function report(){parent.postMessage({type:'atix:height',height:document.body.scrollHeight},'*');}window.addEventListener('message',event=>{if(event.source!==screen.contentWindow||event.data?.type!=='atix:screen-height'||!Number.isFinite(event.data.height))return;screen.style.height=Math.max(540,Math.min(4500,event.data.height))+'px';report();});screen.addEventListener('load',()=>{document.querySelector('.account').open=false;report();});new ResizeObserver(report).observe(document.body);</script></body></html>
