<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Profile | Atix Contractors</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="widget.css"><link rel="stylesheet" href="profile.css"></head><body><main class="profile-page"><a id="profileBack" class="profile-back">← Project overview</a><h1>My Profile</h1><section class="profile-card"><h2>Personal Information</h2><form id="profileForm"><div class="profile-field"><label for="profileFirstName">FIRST NAME:</label><input id="profileFirstName" class="form-control" autocomplete="given-name" required></div><div class="profile-field"><label for="profileLastName">LAST NAME:</label><input id="profileLastName" class="form-control" autocomplete="family-name" required></div><div class="profile-field"><label for="profileEmail">EMAIL:</label><input id="profileEmail" class="form-control" type="email" readonly aria-readonly="true" aria-describedby="profileEmailNote"><small id="profileEmailNote">Your sign-in email cannot be changed.</small></div><div class="profile-field"><label for="profilePhone">PHONE:</label><input id="profilePhone" class="form-control" type="tel" autocomplete="tel"></div><div class="profile-actions"><p id="profileStatus" role="status"></p><button class="btn btn-primary" type="submit">SAVE</button></div></form></section></main><script src="project-state.js"></script><script src="auth.js"></script><script src="profile.js"></script><script src="embed.js"></script></body></html>
